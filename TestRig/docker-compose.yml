# The AXTerm test rig: a real LinBPQ node on a simulated shared channel.
#
#   default:  kisshub (perfect channel, degradable via env) + linbpq
#   rf:       direwolf with a PulseAudio loopback — every frame is
#             genuinely AFSK-modulated and demodulated (experimental)
#
#   docker compose up -d          # the deterministic rig
#   docker compose --profile rf up -d direwolf-rf linbpq-rf
#   docker compose --profile dual up -d   # two frequencies + a bridge node
#
# Point AXTerm's Connection at 127.0.0.1:8010 (hub) or :8012 (rf).

networks:
  channel:
    ipam:
      config:
        - subnet: 172.28.99.0/24

services:
  kisshub:
    build: ./kisshub
    networks:
      channel:
        ipv4_address: 172.28.99.10
    ports:
      - "8010:8010"
    environment:
      LOSS: "0"
      DELAY_MS: "0"
      JITTER_MS: "0"

  linbpq:
    build: ./linbpq
    platform: linux/arm/v7
    depends_on:
      - kisshub
    networks:
      channel:
        ipv4_address: 172.28.99.20
    ports:
      - "8011:8011"
    restart: unless-stopped

  # --- aprs: the reference implementation, on the air ------------------
  # Real Xastir as an APRS station on the shared channel, so "AXTerm matches
  # Xastir" becomes a claim a test can fail instead of a comment. See
  # xastir/Dockerfile for why it needs a pty bridge and a virtual X server.
  #
  #   docker compose --profile aprs up -d
  #
  # XASTIR-1 answers queries and beacons; XASTIR-2 is deliberately configured
  # not to beacon at all, so a query answer cannot be confused with a posit
  # that was coming anyway — the exact ambiguity APRSAnswerEvidence exists for.
  xastir:
    profiles: ["aprs"]
    build: ./xastir
    depends_on:
      - kisshub
    networks:
      channel:
        ipv4_address: 172.28.99.40
    environment:
      CALLSIGN: "XASTIR-1"
      HUB_HOST: "kisshub"
      HUB_PORT: "8010"
      STATION_LAT: "3936.700N"
      STATION_LONG: "10443.900W"
      POSIT_RATE: "600"
    restart: unless-stopped

  xastir-quiet:
    profiles: ["aprs"]
    build: ./xastir
    depends_on:
      - kisshub
    networks:
      channel:
        ipv4_address: 172.28.99.41
    environment:
      CALLSIGN: "XASTIR-2"
      HUB_HOST: "kisshub"
      HUB_PORT: "8010"
      STATION_LAT: "3940.000N"
      STATION_LONG: "10450.000W"
      DISABLE_POSIT_TX: "1"
      POSIT_RATE: "86400"
    restart: unless-stopped

  # --- rfnet: everything over real AFSK, one modem per station ---------
  # A genuinely live-RF version of the aprs profile. No frame-copying hub:
  # every station has its own Direwolf, all of them playing into and listening
  # to one shared PulseAudio null sink. Each frame is modulated to 1200-baud
  # AFSK, mixed into the same audio, and demodulated by every other modem —
  # with its own DCD, TXDELAY and slot timing. Two stations that key together
  # garble each other for real.
  #
  #   docker compose --profile rfnet up -d
  #   # AXTerm / the oracle script -> 127.0.0.1:8013
  #
  # Slower and lossier than the hub, which is the point: it is the closest the
  # rig gets to the air, and answers that survive it survive a real channel.
  rf-ether:
    profiles: ["rfnet"]
    build: ./pulse
    networks:
      channel:
        ipv4_address: 172.28.99.50
    environment:
      ETHER_VOLUME: "25%"

  # One modem per station. KISS ports differ only so the logs are readable.
  modem-a:
    profiles: ["rfnet"]
    build: ./direwolf
    depends_on: [rf-ether]
    networks:
      channel:
        ipv4_address: 172.28.99.51
    environment:
      PULSE_SERVER: "tcp:172.28.99.50:4713"
      MYCALL: "XASTIR-1"
      KISSPORT: "8001"
    restart: unless-stopped

  modem-b:
    profiles: ["rfnet"]
    build: ./direwolf
    depends_on: [rf-ether]
    networks:
      channel:
        ipv4_address: 172.28.99.52
    environment:
      PULSE_SERVER: "tcp:172.28.99.50:4713"
      MYCALL: "XASTIR-2"
      KISSPORT: "8001"
    restart: unless-stopped

  # The modem AXTerm (or scripts/xastir_oracle.py) connects to, so our frames
  # are modulated by a radio of our own rather than injected into a hub.
  modem-us:
    profiles: ["rfnet"]
    build: ./direwolf
    depends_on: [rf-ether]
    networks:
      channel:
        ipv4_address: 172.28.99.53
    ports:
      - "8013:8001"
    environment:
      PULSE_SERVER: "tcp:172.28.99.50:4713"
      MYCALL: "K0EPI-7"
      KISSPORT: "8001"
    restart: unless-stopped

  # A digipeater and nothing else — the AD1CT case, reproduced.
  #
  # It repeats WIDEn-N traffic with callsign substitution, and answers no query
  # ever, because there is no APRS application behind the modem. That is the
  # single most common station on a real APRS channel and the one that made
  # "it hears me but won't answer" look like a bug.
  modem-digi:
    profiles: ["rfnet"]
    build: ./direwolf
    depends_on: [rf-ether]
    networks:
      channel:
        ipv4_address: 172.28.99.56
    environment:
      PULSE_SERVER: "tcp:172.28.99.50:4713"
      MYCALL: "RFDIGI-1"
      KISSPORT: "8001"
      DIGIPEAT: "DIGIPEAT 0 0 ^WIDE[3-7]-[1-7]$$ ^WIDE[12]-[12]$$ TRACE"
    restart: unless-stopped

  xastir-rf-a:
    profiles: ["rfnet"]
    build: ./xastir
    depends_on: [modem-a]
    networks:
      channel:
        ipv4_address: 172.28.99.54
    environment:
      CALLSIGN: "XASTIR-1"
      HUB_HOST: "172.28.99.51"      # its own modem's KISS port, not a hub
      HUB_PORT: "8001"
      STATION_LAT: "3936.700N"
      STATION_LONG: "10443.900W"
      POSIT_RATE: "600"
    restart: unless-stopped

  xastir-rf-b:
    profiles: ["rfnet"]
    build: ./xastir
    depends_on: [modem-b]
    networks:
      channel:
        ipv4_address: 172.28.99.55
    environment:
      CALLSIGN: "XASTIR-2"
      HUB_HOST: "172.28.99.52"
      HUB_PORT: "8001"
      STATION_LAT: "3940.000N"
      STATION_LONG: "10450.000W"
      DISABLE_POSIT_TX: "1"
      POSIT_RATE: "86400"
    restart: unless-stopped

  # --- dual: a second frequency ---------------------------------------
  # hub B on :8020 with its own node, and a bridge node with one port on
  # each hub. Point one AXTerm radio at :8010 and another at :8020.
  kisshub-b:
    profiles: ["dual"]
    build: ./kisshub
    networks:
      channel:
        ipv4_address: 172.28.99.11
    ports:
      - "8020:8020"
    environment:
      PORT: "8020"
      LOSS: "0"
      DELAY_MS: "0"
      JITTER_MS: "0"

  linbpq-b:
    profiles: ["dual"]
    build: ./linbpq
    platform: linux/arm/v7
    depends_on:
      - kisshub-b
    networks:
      channel:
        ipv4_address: 172.28.99.23
    volumes:
      - ./linbpq/bpq32-b.cfg:/opt/bpq/bpq32.cfg:ro
    restart: unless-stopped

  linbpq-bridge:
    profiles: ["dual"]
    build: ./linbpq
    platform: linux/arm/v7
    depends_on:
      - kisshub
      - kisshub-b
    networks:
      channel:
        ipv4_address: 172.28.99.24
    volumes:
      - ./linbpq/bpq32-bridge.cfg:/opt/bpq/bpq32.cfg:ro
    # Twenty seconds behind TSTNOD. Both run a one-minute NODES timer, and
    # started together they keyed up in the same second every minute — the
    # hub's collision model destroyed both, and hub A never heard a NODES
    # frame. Real nodes drift apart; here they have to be told to.
    command: ["sh", "-c", "sleep 20 && exec /opt/bpq/linbpq"]
    restart: unless-stopped

  linbpq-far:
    profiles: ["multi"]
    build: ./linbpq
    platform: linux/arm/v7
    depends_on:
      - kisshub
    networks:
      channel:
        ipv4_address: 172.28.99.22
    volumes:
      - ./linbpq/bpq32-far.cfg:/opt/bpq/bpq32.cfg:ro
    restart: unless-stopped

  kanode:
    profiles: ["multi"]
    build: ./kanode
    depends_on:
      - kisshub
    networks:
      channel:
        ipv4_address: 172.28.99.23
    restart: unless-stopped

  nodefarm:
    profiles: ["multi", "farm"]
    build: ./nodefarm
    depends_on:
      - kisshub
    environment:
      FARM_SEED: "${FARM_SEED:-1}"
    networks:
      channel:
        ipv4_address: 172.28.99.40
    restart: unless-stopped

  direwolf-rf:
    profiles: ["rf"]
    build: ./direwolf
    networks:
      channel:
        ipv4_address: 172.28.99.30
    ports:
      - "8012:8001"

  linbpq-rf:
    profiles: ["rf"]
    build:
      context: ./linbpq
      dockerfile: Dockerfile
    platform: linux/arm/v7
    depends_on:
      - direwolf-rf
    networks:
      channel:
        ipv4_address: 172.28.99.21
    volumes:
      - ./direwolf/bpq32-rf.cfg:/opt/bpq/bpq32.cfg:ro
    restart: unless-stopped
