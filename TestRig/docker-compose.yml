# The AXTerm test rig: a real LinBPQ node on a simulated shared channel.
#
#   default:  kisshub (perfect channel, degradable via env) + linbpq
#   rf:       direwolf with a PulseAudio loopback — every frame is
#             genuinely AFSK-modulated and demodulated (experimental)
#
#   docker compose up -d          # the deterministic rig
#   docker compose --profile rf up -d direwolf-rf linbpq-rf
#   docker compose --profile dual up -d   # two frequencies + a bridge node
#
# Point AXTerm's Connection at 127.0.0.1:8010 (hub) or :8012 (rf).

networks:
  channel:
    ipam:
      config:
        - subnet: 172.28.99.0/24

services:
  kisshub:
    build: ./kisshub
    networks:
      channel:
        ipv4_address: 172.28.99.10
    ports:
      - "8010:8010"
    environment:
      LOSS: "0"
      DELAY_MS: "0"
      JITTER_MS: "0"

  linbpq:
    build: ./linbpq
    platform: linux/arm/v7
    depends_on:
      - kisshub
    networks:
      channel:
        ipv4_address: 172.28.99.20
    ports:
      - "8011:8011"
    restart: unless-stopped

  # --- dual: a second frequency ---------------------------------------
  # hub B on :8020 with its own node, and a bridge node with one port on
  # each hub. Point one AXTerm radio at :8010 and another at :8020.
  kisshub-b:
    profiles: ["dual"]
    build: ./kisshub
    networks:
      channel:
        ipv4_address: 172.28.99.11
    ports:
      - "8020:8020"
    environment:
      PORT: "8020"
      LOSS: "0"
      DELAY_MS: "0"
      JITTER_MS: "0"

  linbpq-b:
    profiles: ["dual"]
    build: ./linbpq
    platform: linux/arm/v7
    depends_on:
      - kisshub-b
    networks:
      channel:
        ipv4_address: 172.28.99.23
    volumes:
      - ./linbpq/bpq32-b.cfg:/opt/bpq/bpq32.cfg:ro
    restart: unless-stopped

  linbpq-bridge:
    profiles: ["dual"]
    build: ./linbpq
    platform: linux/arm/v7
    depends_on:
      - kisshub
      - kisshub-b
    networks:
      channel:
        ipv4_address: 172.28.99.24
    volumes:
      - ./linbpq/bpq32-bridge.cfg:/opt/bpq/bpq32.cfg:ro
    # Twenty seconds behind TSTNOD. Both run a one-minute NODES timer, and
    # started together they keyed up in the same second every minute — the
    # hub's collision model destroyed both, and hub A never heard a NODES
    # frame. Real nodes drift apart; here they have to be told to.
    command: ["sh", "-c", "sleep 20 && exec /opt/bpq/linbpq"]
    restart: unless-stopped

  linbpq-far:
    profiles: ["multi"]
    build: ./linbpq
    platform: linux/arm/v7
    depends_on:
      - kisshub
    networks:
      channel:
        ipv4_address: 172.28.99.22
    volumes:
      - ./linbpq/bpq32-far.cfg:/opt/bpq/bpq32.cfg:ro
    restart: unless-stopped

  kanode:
    profiles: ["multi"]
    build: ./kanode
    depends_on:
      - kisshub
    networks:
      channel:
        ipv4_address: 172.28.99.23
    restart: unless-stopped

  nodefarm:
    profiles: ["multi", "farm"]
    build: ./nodefarm
    depends_on:
      - kisshub
    environment:
      FARM_SEED: "${FARM_SEED:-1}"
    networks:
      channel:
        ipv4_address: 172.28.99.40
    restart: unless-stopped

  direwolf-rf:
    profiles: ["rf"]
    build: ./direwolf
    networks:
      channel:
        ipv4_address: 172.28.99.30
    ports:
      - "8012:8001"

  linbpq-rf:
    profiles: ["rf"]
    build:
      context: ./linbpq
      dockerfile: Dockerfile
    platform: linux/arm/v7
    depends_on:
      - direwolf-rf
    networks:
      channel:
        ipv4_address: 172.28.99.21
    volumes:
      - ./direwolf/bpq32-rf.cfg:/opt/bpq/bpq32.cfg:ro
    restart: unless-stopped
