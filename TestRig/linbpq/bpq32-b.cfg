; LinBPQ configuration for the AXTerm test rig — the node on hub B.
;
; Hub B is a second frequency. This node hears only hub B, so an AXTerm
; with two radios (hub A on 8010, hub B on 8020) must show CHBNOD on
; the second radio and nowhere else.

SIMPLE
NODECALL=BPQTX3-7
NODEALIAS=CHBNOD
LOCATOR=NONE

IDMSG:
AXTerm rig hub-B node - BPQTX3-7 (CHBNOD)
***

INFOMSG:
LinBPQ on hub B of the AXTerm docker test rig.
Nothing here ever touches RF.
***

CTEXT:
Welcome to CHBNOD, the AXTerm test rig node on hub B.
Try NODES, ROUTES, MH, INFO, BYE.
***
FULL_CTEXT=1

NODESINTERVAL=1
IDINTERVAL=30
OBSINIT=5
OBSMIN=3
MINQUAL=50
BTINTERVAL=0

PORT
 PORTNUM=1
 ID=KISS hub B
 TYPE=ASYNC
 PROTOCOL=KISS
 FULLDUP=0
 IPADDR=172.28.99.11
 TCPPORT=8020
 CHANNEL=A
 PERSIST=200
 SLOTTIME=100
 TXDELAY=1
 TXTAIL=1
 QUALITY=192
 MAXFRAME=4
 FRACK=4000
 RESPTIME=1000
 RETRIES=8
 PACLEN=128
ENDPORT
