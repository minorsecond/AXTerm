; LinBPQ configuration for the AXTerm test rig — the bridge node.
;
; One BPQ identity on two ports: hub A and hub B. This is the live
; example of what AXTerm's "one node on every radio" setting does —
; one NODECALL announced on both frequencies under one alias — and of
; cross-port L3 forwarding: TSTNOD (hub A only) and CHBNOD (hub B
; only) can reach each other through BRGNOD. An AXTerm with two
; radios must show BRGNOD on both, with independent link qualities.

SIMPLE
NODECALL=BPQTX4-7
NODEALIAS=BRGNOD
LOCATOR=NONE

IDMSG:
AXTerm rig bridge node - BPQTX4-7 (BRGNOD) on hubs A and B
***

INFOMSG:
LinBPQ bridging hub A and hub B of the AXTerm docker test rig.
Nothing here ever touches RF.
***

CTEXT:
Welcome to BRGNOD, the AXTerm test rig bridge. Two ports, one node.
Try NODES, ROUTES, PORTS, MH, INFO, BYE.
***
FULL_CTEXT=1

NODESINTERVAL=1
IDINTERVAL=30
OBSINIT=5
OBSMIN=3
MINQUAL=50
BTINTERVAL=0

PORT
 PORTNUM=1
 ID=KISS hub A
 TYPE=ASYNC
 PROTOCOL=KISS
 FULLDUP=0
 IPADDR=172.28.99.10
 TCPPORT=8010
 CHANNEL=A
 PERSIST=200
 SLOTTIME=100
 TXDELAY=1
 TXTAIL=1
 QUALITY=192
 MAXFRAME=4
 FRACK=4000
 RESPTIME=1000
 RETRIES=8
 PACLEN=128
ENDPORT

PORT
 PORTNUM=2
 ID=KISS hub B
 TYPE=ASYNC
 PROTOCOL=KISS
 FULLDUP=0
 IPADDR=172.28.99.11
 TCPPORT=8020
 CHANNEL=A
 PERSIST=200
 SLOTTIME=100
 TXDELAY=1
 TXTAIL=1
 QUALITY=192
 MAXFRAME=4
 FRACK=4000
 RESPTIME=1000
 RETRIES=8
 PACLEN=128
ENDPORT
