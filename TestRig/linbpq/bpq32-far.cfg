; LinBPQ configuration for the AXTerm test rig.
;
; A real BPQ node on the simulated channel: it beacons ID, broadcasts
; NODES every minute (fast on purpose — the rig exists to exercise
; AXTerm's learning), answers connects with a CTEXT, and serves the
; usual node commands. Callsign is fictional and never leaves docker.

SIMPLE
NODECALL=BPQTX2-7
NODEALIAS=FARNOD
LOCATOR=NONE

IDMSG:
AXTerm rig FAR node - BPQTX2-7 (FARNOD)
***

INFOMSG:
LinBPQ running inside the AXTerm docker test rig.
Nothing here ever touches RF.
***

CTEXT:
Welcome to TSTNOD, the AXTerm test rig node.
Try NODES, ROUTES, MH, INFO, BYE.
***
FULL_CTEXT=1

; Fast timers so tests never wait on real-network patience.
NODESINTERVAL=1
IDINTERVAL=9
OBSINIT=5
OBSMIN=3
MINQUAL=50
BTINTERVAL=0

PORT
 PORTNUM=1
 ID=KISS hub channel
 TYPE=ASYNC
 PROTOCOL=KISS
 FULLDUP=0
 IPADDR=172.28.99.10
 TCPPORT=8010
 CHANNEL=A
 PERSIST=200
 SLOTTIME=100
 TXDELAY=1
 TXTAIL=1
 QUALITY=192
 MAXFRAME=4
 FRACK=4000
 RESPTIME=1000
 RETRIES=8
 PACLEN=128
ENDPORT

PORT
 PORTNUM=2
 ID=Telnet sysop console
 DRIVER=TELNET
 CONFIG
  LOGGING=0
  DisconnectOnClose=1
  CMS=0
  TCPPORT=8011
  FBBPORT=0
  HTTPPORT=0
  LOGINPROMPT=user:
  PASSWORDPROMPT=password:
  MAXSESSIONS=5
  CTEXT=AXTerm rig sysop console. You are talking to TSTNOD.\n
  USER=sysop,sysop,BPQTST,,SYSOP
ENDPORT
